security:
    # Where Symfony loads users from: the User entity, found by e-mail.
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Dev tools and static assets never need authentication.
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        api:
            pattern: ^/api
            # No sessions or cookies: every request must send its own token.
            stateless: true
            provider: app_user_provider
            # Reads "Authorization: Bearer <token>" and passes it to our handler.
            access_token:
                token_handler: App\Security\AccessTokenHandler
                # Our own problem+json response when the token is invalid.
                failure_handler: App\Security\AuthenticationFailureHandler

    # Only the first matching rule is applied.
    access_control:
        # Briefings are public.
        - { path: ^/api/briefings, roles: PUBLIC_ACCESS }
        # Everything else under /api needs a valid token.
        - { path: ^/api, roles: ROLE_USER }