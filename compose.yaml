services:
  app:
    build: .
    # Runs the migrations (retrying while the database warms up), then starts the web server.
    command: ["sh", "docker/start.sh"]
    ports:
      - "8000:8000"
    # Your own secrets (e.g. NASA_API_KEY) live in the uncommitted .env.local file.
    # It is optional: without it, the app falls back to NASA_API_KEY=DEMO_KEY from .env.
    # Values under "environment" below always win over this file.
    env_file:
      - path: .env.local
        required: false
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET:-change-me}
      DATABASE_URL: "postgresql://almanac:almanac@database:5432/almanac?serverVersion=16&charset=utf8"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: almanac
      POSTGRES_USER: almanac
      POSTGRES_PASSWORD: almanac
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U almanac -d almanac"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data: