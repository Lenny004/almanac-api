services:
  app:
    build: .
    command: sh -c "php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration && php -S 0.0.0.0:8000 -t public"
    ports:
      - "8000:8000"
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET:-change-me}
      DATABASE_URL: "postgresql://almanac:almanac@database:5432/almanac?serverVersion=16&charset=utf8"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: almanac
      POSTGRES_USER: almanac
      POSTGRES_PASSWORD: almanac
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U almanac -d almanac"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data: